# SkillSpector baseline — archify
#
# False positives VERIFIED one by one against the code, on 2026-09-17, in the
# skill-guard static scan. Each rule below was opened, the snippet read, and
# the match cause identified — none was suppressed for being inconvenient.
#
# What is NOT here, on purpose:
#   SC4 — fast-uri==3.1.5 with 4 CVEs (via ajv). REAL finding, stays visible
#         until fixed upstream.
#   SC1 — "ajv": "^8.17.1" without an exact pin. True, albeit minor.
#
# Context: archify is a vendored rendering toolkit (MIT, ~62k stars) — a
# large Node CLI with a test suite and a WOFF2 font embedded in the HTML
# template. Almost all the noise comes from there, not from the skill.
#
# Re-evaluate when the archify version changes: new source, new verdict.

version: 2

rules:
  - id: "AE1"
    reason: >-
      Partial coverage, not evasion: bin/archify.mjs (2101 lines),
      assets/template.html (14934 lines) and renderers/ exceed the scanner's
      per-file inspection limit. Coverage signal, and already reported
      separately by the gate as "coverage: partial".

  - id: "P2"
    message: "*"
    reason: >-
      "Hidden Instructions" matching common HTML/SVG comments
      (<!-- Toolbar -->, <!-- Definitions -->, <!-- Legend -->) in the
      template, the renderers, and the parsing tests. They are markup
      comments, not instructions directed at an agent.

  - id: "YR4"
    reason: >-
      YARA MCP tool poisoning rule matching the base64 blob of the
      JetBrains Mono font embedded in the template (prefix d09GMg = "wOF2",
      the WOFF2 magic) combined with "description =" from the CSS. It is a
      font, not a tool manifest — archify exposes no MCP tool.

  - id: "EA3"
    message: "*NOT LIMITED TO*"
    reason: >-
      "Scope Creep" matching the NOT LIMITED TO phrase from the SIL Open
      Font License text (assets/JetBrainsMono-OFL.txt and the same license
      embedded in the template and the examples). License boilerplate.

  - id: "RA2"
    reason: >-
      "Session Persistence" matching the JavaScript identifier pList, a
      local variable of the renderer (assets/template.html) and of the
      relationship test. Name collision, no session persistence.

  - id: "PE3"
    path: "test/*"
    reason: >-
      "Credential Access" matching the strings /etc/passwd, secret.txt and
      "access tokens" inside test files — they are fixtures verifying the
      handling of those very cases, not credential reads.

  - id: "RP1"
    path: "test/*"
    reason: >-
      "MCP Rug Pull" in test files, with no associated snippet and a
      confidence of 0.7. archify is not an MCP server and declares no tools.

  - id: "TM1"
    path: "test/*"
    reason: >-
      "Tool Parameter Abuse" matching the word "remove" in a comment of
      test/reader-layout-browser.test.mjs.

  - id: "MP3"
    path: "test/*"
    reason: >-
      "Memory Manipulation" matching "reset state" in
      test/update-notifier.test.mjs — test state reset.

  - id: "OH3"
    path: "test/*"
    reason: >-
      "Unbounded Output" matching "without cutting" in
      test/readme-showcase.test.mjs, an assertion about text truncation.

  - id: "LP3"
    path: "SKILL.md"
    reason: >-
      "MCP Least Privilege" evaluated against a SKILL.md that declares no
      MCP server or tool — the rule does not apply to this skill.