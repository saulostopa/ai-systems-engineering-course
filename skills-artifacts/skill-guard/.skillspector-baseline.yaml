# SkillSpector baseline — skill-guard
#
# A skill que ensina a reconhecer `curl | bash` foi marcada por escrever
# `curl | bash`. As duas ocorrências de SC2 estão nas linhas em que a skill
# NOMEIA o padrão para quem vai ler o relatório do scanner — é vocabulário de
# documentação, não instrução de execução.
#
# Verificado em 2026-09-17: SKILL.md:55 (lista de IDs de padrão) e SKILL.md:103
# (a regra "o estático pega curl | bash e leitura de ~/.ssh").
#
# A alternativa seria parafrasear o padrão para não casar com a regra. Seria
# pior: quem lê o relatório precisa encontrar no texto a mesma string que viu
# no achado. Documentação de segurança precisa poder citar o que descreve.

version: 2

rules:
  - id: "SC2"
    path: "SKILL.md"
    reason: >-
      Falso positivo por autorreferência: a skill cita o padrão `curl | bash`
      ao explicar o que o scanner detecta e o que o modo estático pega bem.
      Não há execução, fetch remoto nem script a ser buscado — é prosa
      didática nomeando a própria regra SC2.

  # Este é circular e vale explicar: ao citar o próprio arquivo de baseline, a
  # SKILL.md gera uma referência que o scanner não consegue resolver — porque o
  # SkillSpector exclui de propósito o baseline selecionado da análise de
  # conteúdo (para que o texto das supressões não vire achado). A referência
  # fica "out_of_scope" e sai como sinal de cobertura.
  - id: "AE1"
    path: "SKILL.md"
    message: "*.skillspector-baseline.yaml*"
    reason: >-
      Referência à `.skillspector-baseline.yaml` marcada como out_of_scope: o
      próprio SkillSpector exclui o baseline da análise de conteúdo, então a
      referência nunca resolve. Sinal de cobertura sobre um arquivo excluído
      por design, não conteúdo não inspecionado.
