# Config do app harness — gates E2E
# O e2e-gate.sh lê esta seção para saber o que é frontend e onde vive a suíte E2E.

qa:
  frontend_paths: "src|app"          # pastas de frontend (regex separada por |)
  frontend_extensions: "tsx vue jsx ts js"
  e2e_test_path: "tests/e2e"         # onde vive a suíte E2E

# Exemplo: para um repo Webmotors com src/ e tests/e2e/, esta config já funciona.